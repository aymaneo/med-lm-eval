# MedQA Baseline RL Training Configuration
# Single GPU setup (RTX A6000 - 48GB VRAM)

# GPU allocation - use GPU 0 for everything
inference_gpu_ids = [0]
trainer_gpu_ids = [0]

max_steps = 40

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"

[wandb]
project = "medarc-rl"
name = "medqa-qwen0.5b-baseline"

[orchestrator]
batch_size = 8
rollouts_per_example = 4

[orchestrator.sampling]
max_tokens = 384

[[orchestrator.env]]
id = "medqa"

[trainer.optim]
lr = 1.0e-6

[inference]
gpu_memory_utilization = 0.6

[ckpt]
interval = 1000
