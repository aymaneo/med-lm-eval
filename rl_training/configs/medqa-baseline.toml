# MedQA Baseline RL Training Configuration
# Single GPU setup (RTX A6000 - 48GB VRAM)
# Model: Qwen2.5-3B-Instruct (3B params)
# Goal: Show clear reward improvement over 50 steps

# GPU allocation - use GPU 0 for everything
inference_gpu_ids = [0]
trainer_gpu_ids = [0]

max_steps = 50

[model]
name = "Qwen/Qwen2.5-3B-Instruct"

[wandb]
project = "medarc-rl"
name = "medqa-qwen2.5-3b-50steps"

[orchestrator]
batch_size = 4
rollouts_per_example = 4

[orchestrator.sampling]
max_tokens = 384

[[orchestrator.env]]
id = "medqa"

[trainer.optim]
lr = 3.0e-6

[inference]
gpu_memory_utilization = 0.70

[ckpt]
interval = 25
