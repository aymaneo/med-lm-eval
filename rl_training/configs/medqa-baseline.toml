# MedQA Baseline RL Training Configuration
# Absolute minimum config

max_steps = 100

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"

[wandb]
project = "medarc-rl"
name = "medqa-qwen0.5b-baseline"

[orchestrator]
batch_size = 32
rollouts_per_example = 8

[orchestrator.sampling]
max_tokens = 512

[[orchestrator.env]]
id = "medqa"

[trainer.optim]
lr = 1.0e-6

[inference]

[ckpt]
