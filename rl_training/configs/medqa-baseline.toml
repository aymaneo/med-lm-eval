# MedQA Baseline RL Training Configuration
# Based on Qwen-0.5B with LoRA for efficient training

model = "Qwen/Qwen2.5-0.5B-Instruct"

[env]
id = "medqa"
# Limit dataset for faster iteration
limit_train = 200
limit_eval = 100

[inference]
gpus = 1

[inference.args]
enforce_eager = true
tensor_parallel_size = 1

[trainer]
gpus = 1
run_name = "medqa-qwen0.5b-baseline"

[trainer.args]
# Batch configuration
# micro_batch_size * rollouts_per_example = batch_size
micro_batch_size = 4
rollouts_per_example = 8
batch_size = 32

# Training steps
max_steps = 100

# Sequence length
max_seq_len = 2048

# LoRA configuration for efficient training
use_lora = true
lora_r = 8
lora_alpha = 16
lora_dropout = 0.0
lora_target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

# Optimizer
learning_rate = 1.0e-6
weight_decay = 0.0
lr_scheduler_type = "constant"
warmup_steps = 10

# RL algorithm (KL divergence coefficient)
beta = 0.001

# Logging
logging_steps = 1
eval_steps = 50
save_steps = 100
save_total_limit = 2

# Weights & Biases
report_to = ["wandb"]
wandb_project = "medarc-rl"

# Mixed precision
bf16 = true

# Output directory
output_dir = "./experiments/medqa-baseline"

# Reproducibility
seed = 42
