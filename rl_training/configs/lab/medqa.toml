# MedQA RL Training Configuration for Prime Lab
# Run with: ~/.local/bin/prime rl run rl_training/configs/lab/medqa.toml

model = "Qwen/Qwen3-4B-Instruct-2507"
max_steps = 200
env_file = ["secrets.env"]

# Training parameters
batch_size = 256
rollouts_per_example = 8
learning_rate = 5e-6
lora_alpha = 64

[sampling]
max_tokens = 384
temperature = 0.7

[[env]]
id = "aymaneo/medqa"
args = { use_think = false, shuffle_answers = false }

[wandb]
project = "medarc-rl"
name = "medqa-prime-lab"

# Optional: evaluation during training
[eval]
interval = 50
num_examples = 100
rollouts_per_example = 1

[[eval.env]]
id = "aymaneo/medqa"
args = { use_think = false }
